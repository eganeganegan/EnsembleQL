[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "ensembleql"
version = "0.1.0"
description = "A declarative temporal query engine for molecular dynamics trajectories"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Anthony Egan"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
dataframe = ["pandas>=2"]
test = ["pytest>=8"]
validation = [
  "MDAnalysis==2.10.0",
  "MDAnalysisTests==2.10.0",
  "mdtraj==1.11.1.post2",
  "numpy==2.4.6",
]

[project.scripts]
ensembleql = "ensembleql.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/ensembleql"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
