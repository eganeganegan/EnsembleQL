[build-system]
requires = ["scikit-build-core==1.0.3", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ensembleql"
version = "0.1.0"
description = "A declarative temporal query engine for molecular dynamics trajectories"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Anthony Egan"}]
keywords = [
  "molecular-dynamics",
  "computational-chemistry",
  "trajectory-analysis",
  "temporal-query",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/eganeganegan/EnsembleQL"
Documentation = "https://github.com/eganeganegan/EnsembleQL#readme"
Repository = "https://github.com/eganeganegan/EnsembleQL.git"
Issues = "https://github.com/eganeganegan/EnsembleQL/issues"
Changelog = "https://github.com/eganeganegan/EnsembleQL/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dataframe = ["pandas>=2"]
test = ["pytest>=8"]
validation = [
  "MDAnalysis==2.10.0",
  "MDAnalysisTests==2.10.0",
  "mdtraj==1.11.1.post2",
  "numpy==2.4.6",
]

[project.scripts]
ensembleql = "ensembleql.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DENSEMBLEQL_BUILD_TESTS=OFF"]
install.components = ["python"]
wheel.packages = ["python/ensembleql"]
wheel.reproducible = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]

[tool.cibuildwheel]
build = "cp{311,312,313,314}-*"
skip = ["*-musllinux_*", "cp314t-*"]
build-verbosity = 1
environment = { CMAKE_ARGS = "-DENSEMBLEQL_FETCH_CHEMFILES=ON -DENSEMBLEQL_REQUIRE_CHEMFILES=ON" }
test-command = "python {project}/tools/smoke_test_install.py"

[tool.cibuildwheel.macos]
# Homebrew's libomp can expose runner- and architecture-specific link paths.
# Keep release wheels self-contained and use the serial kernels on macOS.
environment = { CMAKE_ARGS = "-DENSEMBLEQL_FETCH_CHEMFILES=ON -DENSEMBLEQL_REQUIRE_CHEMFILES=ON -DENSEMBLEQL_ENABLE_OPENMP=OFF" }
