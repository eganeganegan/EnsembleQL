name: CI

on:
  push:
  pull_request:

jobs:
  native-and-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify public version metadata
        run: python tools/check_release.py
      - name: Configure native core
        run: cmake -S . -B build -DENSEMBLEQL_BUILD_PYTHON=OFF -DENSEMBLEQL_BUILD_TESTS=ON
      - name: Build native core
        run: cmake --build build --parallel
      - name: Test native core
        run: ctest --test-dir build --output-on-failure
      - name: Build editable Python package
        run: python -m pip install -e '.[test]'
      - name: Test Python API and CLI
        run: python -m pytest -q

  warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with warnings as errors
        run: cmake -S . -B build -DENSEMBLEQL_BUILD_PYTHON=OFF -DENSEMBLEQL_BUILD_TESTS=ON -DENSEMBLEQL_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel

  chemfiles-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with chemfiles
        run: >-
          cmake -S . -B build
          -DENSEMBLEQL_BUILD_PYTHON=OFF
          -DENSEMBLEQL_BUILD_TESTS=ON
          -DENSEMBLEQL_FETCH_CHEMFILES=ON
          -DENSEMBLEQL_REQUIRE_CHEMFILES=ON
      - name: Build optional backend
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  scientific-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: validation/data
          key: scientific-validation-v1
      - name: Build Python package with Chemfiles and install validators
        env:
          CMAKE_ARGS: >-
            -DENSEMBLEQL_FETCH_CHEMFILES=ON
            -DENSEMBLEQL_REQUIRE_CHEMFILES=ON
        run: python -m pip install -e '.[test,validation]'
      - name: Prepare pinned published trajectories
        run: |
          python validation/prepare_adk.py
          python validation/prepare_membrane_peptide.py --download
      - name: Verify independent reference manifests
        run: |
          python validation/generate_adk_reference.py --check
          python validation/generate_membrane_peptide_reference.py --check
      - name: Compare EnsembleQL events with independent references
        run: python -m pytest -q tests/python/test_scientific_validation.py
