name: Release

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the validated artifacts to TestPyPI
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify public version metadata
        run: python tools/check_release.py
      - name: Validate citation metadata
        run: |
          python -m pip install cffconvert==2.0.0
          cffconvert --validate
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/check_release.py --tag "$GITHUB_REF_NAME"

  build-sdist:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build source distribution
        run: |
          python -m pip install build==1.6.0 twine==7.0.0
          python -m build --sdist --outdir dist
          python -m twine check dist/*
      - name: Test source installation
        run: |
          python -m pip install dist/*.tar.gz
          cd /tmp
          python -c "import ensembleql; print(ensembleql.__version__)"
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: macos-14
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.1.1
        with:
          package-dir: .
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-wheels-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ensembleql
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: python-package-*
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ensembleql
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: python-package-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: python-package-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "EnsembleQL $GITHUB_REF_NAME"
